[workspace]
resolver = "3"
# The crates are published from this one repository. What a member requires
# of another crate here on a release line is said once, in
# [workspace.dependencies] below, and taken with `workspace = true`, so a
# release moves every requirement on that crate in one edit. A crate joins
# the table as its first release is made ready; until then, its dependents
# name its path and version themselves, or its path alone where it's a
# dev-dependency of a crate published before it, which that crate's package
# then leaves out. pdfs, which takes every crate in the table, is required
# by none, so it isn't in the table itself. pdf-fixtures, the tests' file
# writer and qpdf, is never published: a crate whose tests use it takes it
# by its path alone, a dev-dependency. Nor is pdf-linearize-lopdf, the lopdf
# adapter, which no member depends on. Nothing else is inherited from here.
members = [
    "crates/pdf-tokenizer",
    "crates/pdf-filters",
    "crates/pdf-crypt",
    "crates/pdf-objects",
    "crates/pdf-structure",
    "crates/pdf-fixtures",
    "crates/pdf-content-streams",
    "crates/pdf-semantics",
    "crates/pdf-color",
    "crates/pdf-fonts",
    "crates/pdf-linearize",
    "crates/pdf-linearize-lopdf",
    "crates/pdfs",
    "crates/pdf-arlington",
    "crates/pdf-lint",
]
# fuzz/ builds on nightly, with libFuzzer.
exclude = ["fuzz"]

# Each crate by its path here and the version its dependents require once
# published: pdf-tokenizer's by caret; pdf-objects', pdf-filters',
# pdf-crypt's, pdf-structure's, pdf-color's, pdf-content-streams',
# pdf-semantics', pdf-fonts' and pdf-linearize's exactly, as an alpha
# promises nothing of the next, and a requirement matches a pre-release only
# where it names one. A crate some member takes without its default features
# has them off here, as an older cargo (1.85's) refused a member's
# `default-features = false` over an entry that leaves them on, and every
# member that takes it names the features it takes: pdf-filters', its Flate
# backend; pdf-semantics' and pdf-fonts', none here, as pdf-lint and
# pdf-linearize take neither the clock nor a font's program nor a predefined
# CMap, and pdfs turns them on through features of its own; pdf-linearize's,
# `family`, as the lopdf adapter's crate takes the engine alone. A
# dev-dependency on a crate here that isn't on crates.io yet is by its path
# alone, as pdf-color's, pdf-semantics' and pdf-fonts' on pdf-structure are,
# which the dependent's package then leaves out, so that it can be published
# first; pdf-linearize's on pdf-structure is through this table, as it
# depends on pdf-structure anyway and is published after it, so its package
# keeps it.
[workspace.dependencies]
pdf-tokenizer = { path = "crates/pdf-tokenizer", version = "0.2" }
pdf-objects = { path = "crates/pdf-objects", version = "=0.1.0-alpha.2" }
pdf-filters = { path = "crates/pdf-filters", version = "=0.1.0-alpha.3", default-features = false }
pdf-crypt = { path = "crates/pdf-crypt", version = "=0.1.0-alpha.2" }
pdf-structure = { path = "crates/pdf-structure", version = "=0.1.0-alpha.1" }
pdf-color = { path = "crates/pdf-color", version = "=0.1.0-alpha.1" }
pdf-content-streams = { path = "crates/pdf-content-streams", version = "=0.1.0-alpha.1" }
pdf-semantics = { path = "crates/pdf-semantics", version = "=0.1.0-alpha.1", default-features = false }
pdf-fonts = { path = "crates/pdf-fonts", version = "=0.1.0-alpha.1", default-features = false }
pdf-linearize = { path = "crates/pdf-linearize", version = "=0.1.0-alpha.1", default-features = false }

# pdf-crypt's revision 6 hash runs thousands of AES blocks and SHA-2
# digests for a password; it and the RustCrypto crates under it built
# optimized in tests too, which then take a fraction of a second, not
# seconds. A profile here changes no crate as it's published.
[profile.dev.package.pdf-crypt]
opt-level = 3

[profile.dev.package.aes]
opt-level = 3

[profile.dev.package.cbc]
opt-level = 3

[profile.dev.package.md-5]
opt-level = 3

[profile.dev.package.rc4]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

# The writer's tests write and read back whole files of millions of
# cross-reference rows, and an object stream's worth of one string, 256
# MiB: pdf-filters and the Flate under it built optimized, and the
# parser, the tokenizer and pdf-structure lightly, so that they take
# seconds, not a minute. Debug assertions and overflow checks stay on.
# Those two tests hold about 1.3 GB each at their peak, which sets
# pdf-structure's test binary's, about 1.9 GB as they run beside the
# rest, whose own peak is about 130 MB.
[profile.dev.package.pdf-filters]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.adler2]
opt-level = 3

[profile.dev.package.pdf-tokenizer]
opt-level = 1

[profile.dev.package.pdf-objects]
opt-level = 1

[profile.dev.package.pdf-structure]
opt-level = 1

# The searches for a byte or a marker in a string, a comment, or a stream's
# or an inline image's data, under the tokenizer and the content streams,
# built optimized.
[profile.dev.package.memchr]
opt-level = 3

# The content streams' tests read operands of 8 MiB, and content of 200,000
# inline images, each held to ten seconds, which a test built unoptimized
# keeps within too: built lightly optimized here, they take a fraction of
# a second.
[profile.dev.package.pdf-content-streams]
opt-level = 1

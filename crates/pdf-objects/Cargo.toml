[package]
name = "pdf-objects"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sheaf-pdf/pdf-lint"
description = "PDF's objects as written: owned values, each with where it was written, and text strings decoded"
keywords = ["pdf", "objects", "pdfdocencoding", "iso-32000"]
categories = ["data-structures", "encoding"]
# Only what users need, so local tooling files can't end up in the package.
include = ["/src", "/README.md", "/CHANGELOG.md", "/LICENSE-*"]

[dependencies]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

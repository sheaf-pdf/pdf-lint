[package]
name = "pdf-objects"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sheaf-pdf/pdf-lint"
documentation = "https://docs.rs/pdf-objects"
description = "PDF's objects as written, their parser and their writer: owned values, each with where it was written, every fault said, and text strings read and written"
keywords = ["pdf", "objects", "parser", "pdfdocencoding", "iso-32000"]
categories = ["data-structures", "encoding", "parser-implementations"]
# Only what users need, so local tooling files can't end up in the package.
include = ["/src", "/README.md", "/CHANGELOG.md"]

[dependencies]
pdf-tokenizer.workspace = true
thiserror = "2"

# `cargo bench` runs the benchmarks alone, not the unit tests' harness in
# bench mode too, so criterion's options reach them as given.
[lib]
bench = false

[dev-dependencies]
# The benchmarks' harness, for `cargo bench`; without its plots and HTML
# reports, which need more than the numbers. Never built for a user of
# the crate.
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

# The benchmarks: `cargo bench -p pdf-objects`. `benches/` is outside
# `include`, so the package carries neither them nor this target.
[[bench]]
name = "objects"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# cargo-fuzz builds with --cfg fuzzing, which compiles the `fuzz` module.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

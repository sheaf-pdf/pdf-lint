[package]
name = "pdf-tokenizer"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sheaf-pdf/pdf-lint"
homepage = "https://github.com/sheaf-pdf/pdf-lint"
documentation = "https://docs.rs/pdf-tokenizer"
description = "A lossless, zero-copy PDF tokenizer that never rejects and never repairs"
keywords = ["pdf", "lexer", "tokenizer", "no-std", "iso-32000"]
categories = ["parser-implementations", "no-std::no-alloc"]
# Only what users need, so local tooling files can't end up in the package.
include = ["/src", "/README.md", "/CHANGELOG.md"]

[dependencies]
# Without std, as the tokenizer needs only core: its searches for a byte or
# a marker (comments, strings, `data_until`) on SIMD where the target has
# it, and AVX2 detected as it runs where the application turns on memchr's
# `std`.
memchr = { version = "2.8", default-features = false }
# Without std, as the tokenizer needs only core.
thiserror = { version = "2", default-features = false }

# `cargo bench` runs the benchmarks alone, not the unit tests' harness in
# bench mode too, so criterion's options reach them as given.
[lib]
bench = false

[dev-dependencies]
# The benchmarks' harness, for `cargo bench`; without its plots and HTML
# reports, which need more than the numbers. Never built for a user of
# the crate.
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

# The benchmarks: `cargo bench -p pdf-tokenizer`. `benches/` is outside
# `include`, so the package carries neither them nor this target.
[[bench]]
name = "tokenize"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# cargo-fuzz builds with --cfg fuzzing, which compiles the `fuzz` module.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

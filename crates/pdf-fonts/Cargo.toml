[package]
name = "pdf-fonts"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.92"
license = "(MIT OR Apache-2.0) AND FTL"
repository = "https://github.com/sheaf-pdf/pdf-lint"
documentation = "https://docs.rs/pdf-fonts"
description = "PDF font reader, text decoder, Standard 14 metrics, CMap interpreter, and glyph bbox extractor"
keywords = ["pdf", "font", "encoding", "cmap", "iso-32000"]
categories = ["parser-implementations", "text-processing"]
# Only what users need, so local tooling files can't end up in the package.
# `assets` holds the fonts' data, with its terms, and `FTL.TXT` the terms of what
# `src/program.rs` takes from FreeType.
include = ["/src", "/assets", "/FTL.TXT", "/README.md", "/CHANGELOG.md"]

[dependencies]
pdf-content-streams.workspace = true
pdf-objects.workspace = true
thiserror = "2"
# With `predefined-cmaps`: Adobe's predefined CMaps, from its bundle alone,
# never a file's bytes.
hayro-cmap = { version = "0.1", optional = true }
# With `programs`: a font's program read, TrueType's by skrifa, CFF's and Type 1's by
# what it has of read-fonts, Type 1's behind its `type1` feature.
skrifa = { version = "0.50", default-features = false, features = ["std", "type1"], optional = true }
# With `embed`: a TrueType program cut to the glyphs a document draws, without
# its default `variable-fonts`, which would bring a second skrifa and
# read-fonts; so a variable font is cut at its default instance.
subsetter = { version = "0.2.6", default-features = false, optional = true }
# The spans of a font's reading, with the `tracing` feature: without its
# default features, so without the proc macros of `attributes`; `std`, for
# its spans' guards.
tracing = { version = "0.1.41", default-features = false, features = ["std"], optional = true }
# With `embed`: the tag a subset's name begins with, from a digest of the
# program and the glyphs it's cut to; XXH3-128 alone, without `std`, as
# pdf-content-streams names its resources.
twox-hash = { version = "2.1", default-features = false, features = ["xxhash3_128"], optional = true }

[features]
default = ["programs"]
# Adobe's predefined CMaps, from hayro-cmap's bundle, off by default. Without
# them, a font's predefined CMap reads as one the build hasn't.
predefined-cmaps = ["dep:hayro-cmap"]
# A font's program read, for its glyphs' boxes and its heights, and the text of what its
# encoding leaves to it. Without it, as `Fonts::for_text` reads.
programs = ["dep:skrifa"]
# A TrueType program embedded: opened through skrifa, the glyphs a string
# draws found by its `cmap`, the program cut to the glyphs drawn by
# subsetter, and the font written as a Type 0 font, its subset named by a
# twox-hash digest. Off by default, and apart from `programs`, which is the
# reading's.
embed = ["dep:skrifa", "dep:subsetter", "dep:twox-hash"]
# Spans through `tracing`: a font read, and within it its program's opening,
# its embedded CMap's and its `/ToUnicode`'s parsing, and a Type 3 font's
# CharProcs; a walk of the strings content shows; and, with `embed`, a font
# written for embedding. A code, a width, a string's text and a glyph's box
# have none. Off by default; without it, none is compiled.
tracing = ["dep:tracing"]

# `cargo bench` runs the benchmarks alone, not the unit tests' harness in
# bench mode too, so criterion's options reach them as given.
[lib]
bench = false

[dev-dependencies]
# The benchmarks' harness, for `cargo bench`; without its plots and HTML
# reports, which need more than the numbers. Never built for a user of
# the crate.
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
# A reading of the tests' files, which is pdf-objects' `Streams` itself. By
# its path alone, which the package's manifest leaves out, as pdf-structure
# isn't on crates.io yet: so the crate packages and publishes on
# pdf-objects and pdf-content-streams alone, and its unit tests don't build
# from the package.
pdf-structure = { path = "../pdf-structure" }
# The tests' file writer. By its path alone, as it's never published, which
# the package's manifest leaves out: so the crate's unit tests don't build
# from its package.
pdf-fixtures = { path = "../pdf-fixtures" }

# The benchmarks: `cargo bench -p pdf-fonts`. `benches/` is outside
# `include`, so the package carries neither them nor this target.
[[bench]]
name = "fonts"
harness = false

# docs.rs documents what `predefined-cmaps` adds, beside the default, the
# spans and what embeds a font.
[package.metadata.docs.rs]
features = ["predefined-cmaps", "tracing", "embed"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# cargo-fuzz builds with --cfg fuzzing, which compiles the `fuzz` module.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

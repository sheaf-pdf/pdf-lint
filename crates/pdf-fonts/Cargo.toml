[package]
name = "pdf-fonts"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sheaf-pdf/pdf-lint"
description = "PDF fonts read: codes, CIDs, widths, heights and text as PDFium reads them, encodings and glyph names, the standard 14's metrics, Type 1 tokens, predefined CMaps, programs' glyph boxes"
keywords = ["pdf", "font", "encoding", "cmap", "iso-32000"]
categories = ["parser-implementations", "text-processing"]
# Only what users need, so local tooling files can't end up in the package.
# `assets` holds the fonts' data, each file with its own terms in it.
include = ["/src", "/assets", "/README.md", "/CHANGELOG.md"]

[dependencies]
pdf-content-streams = { path = "../pdf-content-streams", version = "0.1" }
pdf-objects = { path = "../pdf-objects", version = "0.1" }
# With `structure`: a reading of a file gives a font its streams.
pdf-structure = { path = "../pdf-structure", version = "0.1", optional = true }
thiserror = "2"
# With `predefined-cmaps`: Adobe's predefined CMaps, from its bundle alone,
# never a file's bytes. It needs Rust 1.87.
hayro-cmap = { version = "0.1", optional = true }
# With `programs`: a font's program read, TrueType's by skrifa, CFF's and Type 1's by
# what it has of read-fonts.
skrifa = { version = "0.44", default-features = false, features = ["std"], optional = true }

# Adobe's predefined CMaps, off by default for the Rust they need: without
# them, a font's predefined CMap reads as one the build hasn't.
[features]
default = ["programs"]
predefined-cmaps = ["dep:hayro-cmap"]
# A font's program read, for its glyphs' boxes and its heights, and the text of what its
# encoding leaves to it. Without it, as `Fonts::for_text` reads.
programs = ["dep:skrifa"]
# `Streams` for pdf-structure's `&Reading`, for who reads a file by it.
structure = ["dep:pdf-structure"]

[dev-dependencies]
# The tests' files, and a reading of them.
pdf-structure = { path = "../pdf-structure", version = "0.1", features = ["fixtures"] }

# Each case over a reading of its file, held to PDFium's recorded answer.
[[test]]
name = "pdfium"
required-features = ["structure"]

# docs.rs documents what the feature adds, beside the default.
[package.metadata.docs.rs]
features = ["structure", "predefined-cmaps"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# cargo-fuzz builds with --cfg fuzzing, which compiles the `fuzz` module.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[package]
name = "pdf-raster-pdfium"
version = "0.0.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sheaf-pdf/pdf-lint"
description = "Internal adapter implementing pdf-raster's RenderBackend over pinned libpdfium chromium/8152 (unpublished)"
publish = false

[dependencies]
pdf-pdfium = { path = "../pdf-pdfium" }
pdf-raster.workspace = true
pdf-semantics = { workspace = true }
pdf-structure = { workspace = true, features = ["zlib-rs"] }
thiserror = "2"

[dev-dependencies]
pdf-fixtures = { path = "../pdf-fixtures" }
pdfs = { path = "../pdfs" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[package]
name = "pdf-pdfium"
version = "0.0.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sheaf-pdf/pdf-lint"
description = "Runtime-loaded PDFium rendering oracle and 0-100 visual/ISO conformance rubric for workspace tests (unpublished)"
# Internal workspace oracle: published crates whose tests use it depend on it
# by `path` alone in `[dev-dependencies]`, which `cargo package` strips.
publish = false

[dependencies]
libloading = "0.9"
thiserror = "2"

[lints.rust]
# Only `src/ffi.rs` uses `unsafe` for runtime `libloading` C FFI calls into
# `libpdfium`; `image` and `rubric` forbid `unsafe_code` at module level.
unsafe_code = "allow"
missing_docs = "warn"

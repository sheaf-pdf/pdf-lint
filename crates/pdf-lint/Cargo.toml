[package]
name = "pdf-lint"
version = "0.2.0"
edition = "2024"
# For let-chains.
rust-version = "1.88"
# As the model it embeds and the parts adapted from TestGrammar are.
license = "Apache-2.0"
repository = "https://github.com/sheaf-pdf/pdf-lint"
description = "Checks PDF files against the Arlington PDF Model"
keywords = ["pdf", "lint", "validation", "arlington", "iso-32000"]
categories = ["command-line-utilities", "development-tools::testing"]
# Only what users need. The model is pdf-arlington's, and so is its
# NOTICE.txt, whose notices src/check.rs's header carries for the parts
# adapted from TestGrammar.
include = ["/src", "/README.md", "/CHANGELOG.md"]

[dependencies]
# The command line's, main.rs's alone: the library's errors are its own.
anyhow = "1"
pdf-arlington = { path = "../pdf-arlington", version = "0.1" }
pdf-crypt = { path = "../pdf-crypt", version = "0.1" }
pdf-objects = { path = "../pdf-objects", version = "0.1" }
pdf-structure = { path = "../pdf-structure", version = "0.1" }
pdf-tokenizer = { path = "../pdf-tokenizer", version = "0.1" }
thiserror = "2"

[dev-dependencies]
# The tests' encrypted files.
pdf-crypt = { path = "../pdf-crypt", features = ["writer"] }
# The tests' file writer, and qpdf as a second reader.
pdf-structure = { path = "../pdf-structure", version = "0.1", features = ["fixtures"] }

[lints.rust]
unsafe_code = "forbid"
# cargo-fuzz builds with --cfg fuzzing, which compiles the `fuzz` module.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

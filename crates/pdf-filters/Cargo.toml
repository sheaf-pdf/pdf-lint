[package]
name = "pdf-filters"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sheaf-pdf/pdf-lint"
documentation = "https://docs.rs/pdf-filters"
description = "PDF's standard stream filters, decoded with every fault said and what decoded kept, and Flate encoded, on miniz_oxide or zlib-rs"
keywords = ["pdf", "flate", "lzw", "ascii85", "decompression"]
categories = ["compression", "encoding"]
# Only what users need, so local tooling files can't end up in the package.
include = ["/src", "/README.md", "/CHANGELOG.md"]

[dependencies]
miniz_oxide = { version = "0.9", optional = true }
pdf-tokenizer.workspace = true
thiserror = "2"
# Through its own safe API, on Rust's allocator, not C's.
zlib-rs = { version = "0.6", default-features = false, features = ["rust-allocator", "std"], optional = true }

# Each Flate backend, compiled in by its feature; with both, a caller names
# the one each call takes (`Backend`). With neither, the crate doesn't build.
[features]
default = ["miniz_oxide"]
miniz_oxide = ["dep:miniz_oxide"]
zlib-rs = ["dep:zlib-rs"]

# docs.rs documents both backends, as a caller names either, not the
# default's alone.
[package.metadata.docs.rs]
features = ["zlib-rs"]

# `cargo bench` runs the benchmarks alone, not the unit tests' harness in
# bench mode too, so criterion's options reach them as given.
[lib]
bench = false

[dev-dependencies]
# The benchmarks' harness, for `cargo bench`; without its plots and HTML
# reports, which need more than the numbers. Never built for a user of
# the crate.
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

# The benchmarks: `cargo bench -p pdf-filters --features zlib-rs`, which
# times each backend's. `benches/` is outside `include`, so the package
# carries neither them nor this target.
[[bench]]
name = "filters"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# cargo-fuzz builds with --cfg fuzzing, which compiles the `fuzz` module.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

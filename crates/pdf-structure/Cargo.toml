[package]
name = "pdf-structure"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sheaf-pdf/pdf-lint"
description = "PDF's file structure, read whole or on demand into a document to number, edit, walk and prune in memory: the header, cross-reference sections along /Prev, object streams, recovery by scanning, decrypting and decoding, every choice said; and cross-reference sections, object streams and an encrypted file's objects written"
keywords = ["pdf", "parser", "xref", "object-streams", "iso-32000"]
categories = ["parser-implementations"]
# Only what users need, so local tooling files can't end up in the package.
include = ["/src", "/README.md", "/CHANGELOG.md"]

[dependencies]
pdf-crypt = { path = "../pdf-crypt", version = "0.1" }
# miniz_oxide named, not taken from pdf-filters' default features: it's
# `Options::DEFAULT`'s backend, and `write::Deflate::DEFAULT`'s, which every
# build of this crate has.
pdf-filters = { path = "../pdf-filters", version = "0.1", default-features = false, features = ["miniz_oxide"] }
pdf-objects = { path = "../pdf-objects", version = "0.1" }
pdf-tokenizer = { path = "../pdf-tokenizer", version = "0.1" }
# The file `fixtures` hands qpdf a stream in.
tempfile = { version = "3", optional = true }
thiserror = "2"

# A file's identity, by a handle held open (`bytes::Identity`): its device
# and inode on Unix, its volume serial number and file index on Windows.
[target.'cfg(any(unix, windows))'.dependencies]
same-file = "1"

# On Unix, `Identity::of` opens a file without waiting (`O_NONBLOCK`), as a
# FIFO put at its path would have it wait for a writer.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# Files built in code, and qpdf as a second reader, for other crates' tests
# and fuzz targets: hidden, not for a user. Its encrypted files need
# pdf-crypt's writer; the file it hands qpdf a stream in, tempfile, which
# makes it in the temp folder and removes it after.
fixtures = ["pdf-crypt/writer", "dep:tempfile"]
# pdf-filters' zlib-rs, so that `Options::flate` and `write::Deflate` can
# name it.
zlib-rs = ["pdf-filters/zlib-rs"]

# docs.rs documents both Flate backends, as `Options::flate` and
# `write::Deflate` name either; not `fixtures`, which is hidden.
[package.metadata.docs.rs]
features = ["zlib-rs"]

[dev-dependencies]
# Both Flate backends, so that the tests read each file on each.
pdf-filters = { path = "../pdf-filters", version = "0.1", features = ["zlib-rs"] }
# The tests' encrypted files.
pdf-crypt = { path = "../pdf-crypt", version = "0.1", features = ["writer"] }
# The tests' folders of their own, removed after.
tempfile = "3"
# A seeded generator for the tests' new encrypted files.
chacha20 = { version = "0.10", default-features = false, features = ["rng"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# cargo-fuzz builds with --cfg fuzzing, which compiles the `fuzz` module.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

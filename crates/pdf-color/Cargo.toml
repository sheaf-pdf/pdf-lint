[package]
name = "pdf-color"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sheaf-pdf/pdf-lint"
documentation = "https://docs.rs/pdf-color"
description = "PDF color spaces read: families, components as ISO 32000-2 and PDFium count them, base and alternate spaces, colorants"
keywords = ["pdf", "color", "color-space", "iso-32000", "pdfium"]
categories = ["graphics", "multimedia::images"]
# Only what users need, so local tooling files can't end up in the package.
include = ["/src", "/README.md", "/CHANGELOG.md"]

[dependencies]
pdf-objects.workspace = true
thiserror = "2"

# `cargo bench` runs the benchmarks alone, not the unit tests' harness in
# bench mode too, so criterion's options reach them as given.
[lib]
bench = false

[dev-dependencies]
# The benchmarks' harness, for `cargo bench`; without its plots and HTML
# reports, which need more than the numbers. Never built for a user of
# the crate.
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
# The tests' resolvers: a reading in memory, a reading by position, a
# document. By its path alone, which the package's manifest leaves out, as
# pdf-structure is published after this crate: so the crate packages and
# publishes on pdf-objects alone, and its unit tests don't build from the
# package.
pdf-structure = { path = "../pdf-structure" }
# The tests' file writer. By its path alone, as it's never published, which
# the package's manifest leaves out: so the crate's unit tests don't build
# from its package.
pdf-fixtures = { path = "../pdf-fixtures" }

# The benchmarks: `cargo bench -p pdf-color`. `benches/` is outside
# `include`, so the package carries neither them nor this target.
[[bench]]
name = "color"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# cargo-fuzz builds with --cfg fuzzing, which compiles the `fuzz` module.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

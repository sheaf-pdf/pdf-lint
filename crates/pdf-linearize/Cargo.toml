[package]
name = "pdf-linearize"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sheaf-pdf/pdf-lint"
documentation = "https://docs.rs/pdf-linearize"
description = "PDF files laid out for reading over a network (ISO 32000-2, Annex F): an object graph, of any object model, planned into the order and numbers a linearized file has, the bytes around its bodies, hint tables among them, and whether a file that says it's one holds"
keywords = ["pdf", "linearized", "fast-web-view", "iso-32000"]
categories = ["encoding"]
# Only what users need, so local tooling files can't end up in the package.
include = ["/src", "/README.md", "/CHANGELOG.md"]

[dependencies]
bitstream-io = "4"
pdf-objects.workspace = true
# The page tree and name trees, and not the clock.
pdf-semantics = { workspace = true, optional = true }
pdf-structure = { workspace = true, optional = true }
thiserror = "2"

[features]
default = ["family"]
# `family`: linearize a document of pdf-structure's. The engine builds without it,
# with no document model: an object is pdf-objects' `ObjectId`. The tests take
# pdf-structure as a dev-dependency (below), so they build it either way.
family = ["dep:pdf-semantics", "dep:pdf-structure"]
# pdf-filters' zlib-rs, through pdf-structure, so that `family::Options::deflate` and
# `read` can name it.
zlib-rs = ["pdf-structure?/zlib-rs"]
# The stages of a write told as they end, for a timing's own build; not one to turn on
# for use.
timing = ["family"]

# `cargo bench` runs the benchmarks alone, not the unit tests' harness in
# bench mode too, so criterion's options reach them as given.
[lib]
bench = false

[dev-dependencies]
# A generator the tests can seed, for a new encryption's draws.
chacha20 = { version = "0.10", default-features = false, features = ["rng"] }
# The benchmarks' harness, for `cargo bench`; without its plots and HTML
# reports, which need more than the numbers. Never built for a user of
# the crate.
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
# pdf-structure with its test writer, for the tests' new encryptions from a
# seeded generator and their IVs derived, so that a file written twice is
# the same bytes. Beside the optional normal dependency: the library is
# built without it. Through the workspace's table, not by its path alone:
# the crate depends on pdf-structure anyway, with `family`, so it's
# published after it, and its package keeps this one.
pdf-structure = { workspace = true, features = ["insecure-test-writer"] }

# The benchmarks: `cargo bench -p pdf-linearize`. `benches/` is outside
# `include`, so the package carries neither them nor this target.
[[bench]]
name = "linearize"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# cargo-fuzz builds with --cfg fuzzing, which compiles the `fuzz` module.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[package]
name = "pdf-linearize"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sheaf-pdf/pdf-lint"
description = "PDF files laid out for reading over a network (ISO 32000-2, Annex F): an object graph, of any object model, planned into the order and numbers a linearized file has, and the bytes around its bodies, hint tables among them"
keywords = ["pdf", "linearized", "fast-web-view", "iso-32000"]
categories = ["encoding"]
# Only what users need, so local tooling files can't end up in the package.
include = ["/src", "/README.md", "/CHANGELOG.md"]

[dependencies]
bitstream-io = "4"
pdf-objects = { path = "../pdf-objects", version = "0.1", optional = true }
# The page tree and name trees, and not the clock.
pdf-semantics = { path = "../pdf-semantics", version = "0.1", default-features = false, optional = true }
pdf-structure = { path = "../pdf-structure", version = "0.1", optional = true }
thiserror = "2"

[features]
default = ["family"]
# `family`: linearize a document of pdf-structure's. The engine and its tests build
# without it, with no object model.
family = ["dep:pdf-objects", "dep:pdf-semantics", "dep:pdf-structure"]

[dev-dependencies]
# What the family adapter's tests read back with, by the names the adapter uses.
pdf-objects = { path = "../pdf-objects", version = "0.1" }
pdf-semantics = { path = "../pdf-semantics", version = "0.1", default-features = false }
pdf-structure = { path = "../pdf-structure", version = "0.1" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# cargo-fuzz builds with --cfg fuzzing, which compiles the `fuzz` module.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[package]
name = "pdf-content-streams"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sheaf-pdf/pdf-lint"
description = "PDF content streams read as PDFium reads them: their tokens and operations, each where it is, operands read as pdf-objects values when asked, a page's streams joined as one, under caps, where ISO 32000-2 reads them otherwise, each operator typed by its Annex A, and a page's q/Q balance, marked content and resource names"
keywords = ["pdf", "content-stream", "lexer", "iso-32000"]
categories = ["parser-implementations", "graphics"]
# Only what users need, so local tooling files can't end up in the package.
include = ["/src", "/README.md", "/CHANGELOG.md"]

[dependencies]
pdf-objects = { path = "../pdf-objects", version = "0.1" }
thiserror = "2"
# An operation's operands, sixteen held inline before they spill to the heap.
tinyvec = { version = "1.13", features = ["alloc"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# cargo-fuzz builds with --cfg fuzzing, which compiles the `fuzz` module.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

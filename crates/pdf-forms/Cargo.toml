[package]
name = "pdf-forms"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sheaf-pdf/pdf-lint"
documentation = "https://docs.rs/pdf-forms"
description = "PDF interactive forms: the field tree, inherited field values, widgets, button groups' rules, and text, button, and choice fields' appearances"
keywords = ["pdf", "forms", "acroform", "fields", "iso-32000"]
categories = ["parser-implementations"]
# Only what users need, so local tooling files can't end up in the package.
include = ["/src", "/README.md", "/CHANGELOG.md"]

[dependencies]
pdf-annots.workspace = true
pdf-content-streams.workspace = true
pdf-fonts.workspace = true
pdf-gfx.workspace = true
pdf-objects.workspace = true
pdf-semantics.workspace = true
thiserror = "2"
# Optional Unicode normalization (Standard Annex #15), so that text given
# decomposed is drawn composed, as a font without mark positioning draws it
# right (`text-layout` feature).
unicode-normalization = { version = "0.1.26", optional = true }
# Optional extended grapheme clusters (Standard Annex #29), so that a comb
# field's cell holds a character and its marks, and each is composed a cluster
# at a time (`text-layout` feature).
unicode-segmentation = { version = "1.13.3", optional = true }
# Optional numeric spans for the field tree walk; without proc macros
# (`default-features = false`) and with `std` for span guards.
tracing = { version = "0.1.41", default-features = false, features = ["std"], optional = true }

[features]
default = ["programs", "text-layout"]
# Forwards `pdf-annots/programs` (and so `pdf-gfx/programs` and
# `pdf-fonts/programs`) for embedded font program metrics.
programs = ["pdf-annots/programs", "pdf-gfx/programs", "pdf-fonts/programs"]
# Forwards `pdf-annots/text-layout` and `pdf-gfx/text-layout` for text laid out
# in a widget's rectangle, composed and cut into grapheme clusters.
text-layout = [
    "pdf-annots/text-layout",
    "pdf-gfx/text-layout",
    "dep:unicode-normalization",
    "dep:unicode-segmentation",
]
# Forwards `pdf-fonts/embed` (which brings in `subsetter`) and `pdf-gfx/embed`;
# with `text-layout`, a text field's value is drawn in its font and a TrueType
# program the caller gives for what that font can't draw
# (`appearance::text_with_fallback`). It doesn't turn `text-layout` on, so a
# dependent that embeds without laying text out builds without it.
embed = ["pdf-fonts/embed", "pdf-gfx/embed"]
# Forwards `predefined-cmaps` to `pdf-annots`, `pdf-gfx`, and `pdf-fonts`.
predefined-cmaps = [
    "pdf-annots/predefined-cmaps",
    "pdf-gfx/predefined-cmaps",
    "pdf-fonts/predefined-cmaps",
]
# Emits `debug`-level `tracing` spans with numeric counts (never file
# plaintext, field names, or field values).
tracing = [
    "dep:tracing",
    "pdf-annots/tracing",
    "pdf-content-streams/tracing",
    "pdf-fonts/tracing",
    "pdf-gfx/tracing",
    "pdf-semantics/tracing",
]

[package.metadata.docs.rs]
features = ["predefined-cmaps", "tracing", "embed"]

[lib]
bench = false

[dev-dependencies]
# Path-only dev-dependencies omitted from the published package manifest so
# `pdf-forms` packages cleanly over its zero-I/O library dependencies alone.
pdf-fixtures = { path = "../pdf-fixtures" }
pdf-structure = { path = "../pdf-structure" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

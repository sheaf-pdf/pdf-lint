[package]
name = "pdf-crypt"
version = "0.1.0-alpha.2"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sheaf-pdf/pdf-lint"
documentation = "https://docs.rs/pdf-crypt"
description = "PDF's standard security handler: decrypting with every fault said, encrypting for a writer, and a new file's passwords and permissions"
keywords = ["pdf", "decryption", "encryption", "password", "aes"]
categories = ["cryptography", "encoding"]
# Only what users need, so local tooling files can't end up in the package.
include = ["/src", "/README.md", "/CHANGELOG.md"]

[dependencies]
# RustCrypto's, the primitives under the handler, without what it doesn't
# use (padding schemes, OIDs), each wiping its key schedule or state when
# it's dropped; HMAC-SHA256 for the IVs it encrypts under; and zeroize, for
# the keys and passwords it holds itself.
aes = { version = "0.9", features = ["zeroize"] }
cbc = { version = "0.2", default-features = false, features = ["zeroize"] }
hmac = { version = "0.13", features = ["zeroize"] }
md-5 = { version = "0.11", default-features = false, features = ["zeroize"] }
rc4 = { version = "0.2", features = ["zeroize"] }
sha2 = { version = "0.11", default-features = false, features = ["zeroize"] }
zeroize = "1.9"

# SASLprep (RFC 4013), the form revisions 5 and 6 take a password in; and
# NFC, the composed text the single-byte encodings take, by the tables
# stringprep normalizes with.
stringprep = "0.1.5"
unicode-normalization = "0.1"

# The traits a caller's random number generator meets, which a new file's
# key and salts are drawn from: pdf-crypt has no randomness of its own.
rand_core = "0.10"

thiserror = "2"

# `cargo bench` runs the benchmarks alone, not the unit tests' harness in
# bench mode too, so criterion's options reach them as given.
[lib]
bench = false

[dev-dependencies]
# A seeded generator for the tests' new files: RustCrypto's ChaCha20 as a
# rand_core generator, without its cipher.
chacha20 = { version = "0.10", default-features = false, features = ["rng"] }
# The benchmarks' harness, for `cargo bench`; without its plots and HTML
# reports, which need more than the numbers. Never built for a user of
# the crate.
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

[features]
# An encryption dictionary, and strings and streams encrypted, with salts,
# keys and IVs given, not random: for writing test files, never for a
# writer to protect a document with. Its items are hidden from the docs.
insecure-test-writer = []

# The benchmarks: `cargo bench -p pdf-crypt --features insecure-test-writer`,
# as they open the writer's dictionaries; without the feature, cargo skips
# them.
# `benches/` is outside `include`, so the package carries neither them nor
# this target.
[[bench]]
name = "crypt"
harness = false
required-features = ["insecure-test-writer"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# cargo-fuzz builds with --cfg fuzzing, which compiles the `fuzz` module.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

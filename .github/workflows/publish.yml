name: Publish

# A crate to crates.io, on its version tag (each crate's tags are its name,
# -v and its version: pdf-tokenizer-v0.2.0), by trusted publishing: the
# run's OpenID Connect token is exchanged for a crates.io token that lives
# for the job and is revoked when it ends, so no secret is kept here. The
# crates.io side names this repository, this file, publish.yml, and the
# `release` environment. Before
# it publishes, the tag is checked against the manifest's version and the
# CHANGELOG's dated entry for it, and the package is checked as CI checks
# it on every push.

on:
  push:
    tags: ["pdf-tokenizer-v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  pdf-tokenizer:
    name: Publish pdf-tokenizer
    if: startsWith(github.ref, 'refs/tags/pdf-tokenizer-v')
    runs-on: ubuntu-latest
    # The environment the trusted-publisher entry on crates.io names; GitHub
    # makes it on first use, and any rule put on it there (a reviewer, a
    # branch) then gates the publish.
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: extractions/setup-just@v4
      - name: Check the tag is the crate's version, and the CHANGELOG dates it
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/pdf-tokenizer/Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_NAME" != "pdf-tokenizer-v$version" ]; then
            echo "The tag is $GITHUB_REF_NAME, and pdf-tokenizer's version $version" >&2
            exit 1
          fi
          if ! grep -q "^## $version ([0-9]" crates/pdf-tokenizer/CHANGELOG.md; then
            echo "pdf-tokenizer's CHANGELOG has no dated entry for $version" >&2
            exit 1
          fi
      - name: Package, and check what the package holds
        run: just tokenizer-package
      - name: Get a crates.io token for this run
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish
        run: cargo publish --locked -p pdf-tokenizer
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

name: Publish

# A crate to crates.io, on its version tag (each crate's tags are its name,
# -v and its version: pdf-tokenizer-v0.2.0, pdf-objects-v0.1.0-alpha.1,
# pdf-filters-v0.1.0-alpha.1, pdf-crypt-v0.1.0-alpha.1,
# pdf-color-v0.1.0-alpha.1, pdf-structure-v0.1.0-alpha.1,
# pdf-content-streams-v0.1.0-alpha.1), by trusted
# publishing: the run's OpenID Connect token is exchanged for a crates.io
# token that lives for the job and is revoked when it ends, so no secret is
# kept here. The crates.io side names this repository, this file,
# publish.yml, and the `release` environment. Before it publishes, the tag
# is checked against the manifest's version and the CHANGELOG's dated entry
# for it, and the package is checked as CI checks it on every push.

on:
  push:
    tags: ["pdf-tokenizer-v*", "pdf-objects-v*", "pdf-filters-v*", "pdf-crypt-v*", "pdf-color-v*", "pdf-structure-v*", "pdf-content-streams-v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  pdf-tokenizer:
    name: Publish pdf-tokenizer
    if: startsWith(github.ref, 'refs/tags/pdf-tokenizer-v')
    runs-on: ubuntu-latest
    # The environment the trusted-publisher entry on crates.io names; GitHub
    # makes it on first use, and any rule put on it there (a reviewer, a
    # branch) then gates the publish.
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: extractions/setup-just@v4
      - name: Check the tag is the crate's version, and the CHANGELOG dates it
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/pdf-tokenizer/Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_NAME" != "pdf-tokenizer-v$version" ]; then
            echo "The tag is $GITHUB_REF_NAME, and pdf-tokenizer's version $version" >&2
            exit 1
          fi
          if ! grep -q "^## $version ([0-9]" crates/pdf-tokenizer/CHANGELOG.md; then
            echo "pdf-tokenizer's CHANGELOG has no dated entry for $version" >&2
            exit 1
          fi
      - name: Package, and check what the package holds
        run: just tokenizer-package
      - name: Get a crates.io token for this run
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish
        run: cargo publish --locked -p pdf-tokenizer
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  pdf-objects:
    name: Publish pdf-objects
    if: startsWith(github.ref, 'refs/tags/pdf-objects-v')
    runs-on: ubuntu-latest
    # The environment pdf-tokenizer's job names. crates.io sets a trusted
    # publisher on a crate it has, so a crate's first version may have to be
    # published by hand, with a token, from its tag's commit: a version
    # crates.io has already is said, and not published again.
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: extractions/setup-just@v4
      - name: Check the tag is the crate's version, and the CHANGELOG dates it
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/pdf-objects/Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_NAME" != "pdf-objects-v$version" ]; then
            echo "The tag is $GITHUB_REF_NAME, and pdf-objects' version $version" >&2
            exit 1
          fi
          if ! grep -q "^## $version ([0-9]" crates/pdf-objects/CHANGELOG.md; then
            echo "pdf-objects' CHANGELOG has no dated entry for $version" >&2
            exit 1
          fi
      - name: Package, and check what the package holds
        run: just objects-package
      - name: Look for the version on crates.io
        id: there
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/pdf-objects/Cargo.toml | head -n 1)
          index=$(curl -fs https://index.crates.io/pd/f-/pdf-objects || true)
          if grep -qF "\"vers\":\"$version\"" <<< "$index"; then
            echo "::notice::pdf-objects $version is on crates.io already: nothing to publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Get a crates.io token for this run
        if: steps.there.outputs.published != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish
        if: steps.there.outputs.published != 'true'
        run: cargo publish --locked -p pdf-objects
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}


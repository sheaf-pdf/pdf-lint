name: Oldest qpdf

# The checker's tests against the oldest qpdf it decodes with, 11.9.0, as
# CI runs them against the one the release archives bundle: a change that
# works only with a newer qpdf fails here. `just test-oldest-qpdf` runs the
# same locally.

# Pushes to main, and pull requests: a push to a pull request's branch
# runs once, not once as a push and again as the pull request.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests with qpdf 11.9.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: extractions/setup-just@v4
      - name: Test
        run: just test-oldest-qpdf

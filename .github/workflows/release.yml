name: Release

# On a version tag of pdf-lint's (each crate's tags are its name, -v and
# its version: pdf-lint-v0.1.0, and pdf-tokenizer-v0.1.0, which starts
# nothing here): an archive for each platform, each holding pdf-lint and
# the notices of what it embeds, each checked to run as it's unpacked
# (release/smoke.sh); then a draft GitHub release with them,
# to look over and publish by hand. Run by hand, it builds and checks the
# archives without drafting a release.

on:
  push:
    tags: ["pdf-lint-v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  archive:
    name: Archive for ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static, so that the binary needs nothing of the system.
          - platform: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          # Arm runners are free for public repositories.
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - platform: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
          # Built on Apple silicon, and checked under Rosetta.
          - platform: macos-x86_64
            os: macos-15
            target: x86_64-apple-darwin
          - platform: windows-x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check the tag is the crate's version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/pdf-lint/Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_NAME" != "pdf-lint-v$version" ]; then
            echo "The tag is $GITHUB_REF_NAME, and pdf-lint's version $version" >&2
            exit 1
          fi
      - name: Install Rosetta
        if: matrix.platform == 'macos-x86_64'
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - name: Build
        # The C runtime linked in on Windows, so the binary needs no Visual
        # C++ Redistributable (the README says it's the archive's).
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release --locked -p pdf-lint --target ${{ matrix.target }}
      - name: Archive, and check it runs
        run: >-
          release/dist.sh ${{ matrix.platform }} ${{ matrix.target }}
          target/${{ matrix.target }}/release/pdf-lint${{ runner.os == 'Windows' && '.exe' || '' }}
          dist
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Draft the release
    needs: archive
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Draft a release with the archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          Each archive holds `pdf-lint`, which decodes and decrypts by itself, needing nothing beside it: unpack it anywhere. The Linux binaries are static. Beside each archive, its SHA-256.

          What's compiled in, each crate and its licence, the Rust standard library and, on Linux, musl, has its notices in `THIRD-PARTY-NOTICES.txt`, `RUST-NOTICES.html` and `MUSL-COPYRIGHT`.

          The Arlington PDF Model it checks against is embedded: its NOTICE.txt is `ARLINGTON-NOTICE.txt`, and what the embedded copy corrects and adds, where the model contradicts ISO 32000-2 or lacks what a reference defines, is `ARLINGTON-CORRECTIONS.tsv` and `ARLINGTON-ADDITIONS/`. `pdf-lint --version` says the model's commit and hash.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "pdf-lint ${GITHUB_REF_NAME#pdf-lint-v}" --notes-file notes.md

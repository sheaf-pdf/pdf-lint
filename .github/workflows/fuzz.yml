name: Fuzz

# Each fuzz target under libFuzzer, through `just fuzz` as it runs locally.
# On pull requests and pushes to main, two minutes a target, from the
# corpus the scheduled runs keep. Twice a week, half an hour a target, the
# corpus minimized and kept in the cache for the next run. CI's `just test`
# runs each fuzz body too, as stable unit tests on fixed inputs; here is
# where new inputs are found.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The nightly the targets build on, which `just fuzz` reads, pinned so
  # that a change of nightly is a change here; moved on by hand.
  FUZZ_TOOLCHAIN: nightly-2026-10-16

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [tokenize, filters, crypt, objects, structure, write, content, check]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.FUZZ_TOOLCHAIN }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz@0.13.2
      - uses: extractions/setup-just@v4
      # The newest corpus the scheduled runs kept for this target, if any.
      - uses: actions/cache/restore@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz
        run: just fuzz ${{ matrix.target }} ${{ github.event_name == 'schedule' && 1800 || 120 }}
      # What made a target fail, to run again with
      # `cargo +nightly fuzz run <target> <file>`.
      - name: Keep what it found
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          retention-days: 30
      - name: Minimize the corpus
        if: github.event_name == 'schedule'
        run: just fuzz-cmin ${{ matrix.target }}
      - uses: actions/cache/save@v6
        if: github.event_name == 'schedule' && !cancelled()
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

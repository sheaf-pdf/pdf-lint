name: CI

# Pushes to main, and pull requests: a push to a pull request's branch
# runs once, not once as a push and again as the pull request.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Each step runs a recipe from the justfile, so `just ci` locally checks the
# same things, but `structure-windows`'s, which is cargo's on Windows, and
# `semver`'s, which needs cargo-semver-checks.
jobs:
  check:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.152
      - uses: extractions/setup-just@v4
      - name: Check formatting
        run: just fmt
      - name: Clippy
        run: just clippy
      - name: Build the fuzz targets
        run: just fuzzing
      - name: Test (including doctests)
        run: just test
      # The tests that set the reader, and what the writer writes, beside
      # qpdf, the oracle, against the qpdf the recipe fetches at its
      # pinned version.
      - name: Test against qpdf
        run: just test-qpdf
      # The readers that follow PDFium's rules, each case asked of the
      # PDFium the recipe fetches at its pinned build, its build provenance
      # verified by gh, which the token lets read it.
      - name: Test against PDFium
        run: just test-pdfium
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build documentation
        run: just doc

  # Cross-target, no_std, core-only, and static Linux release-archive builds:
  # - `dist`: the release archive for Linux x86_64 (x86_64-unknown-linux-musl),
  #   checked to run as it's unpacked.
  # - `structure-cross`: pdf-structure linted for Windows
  #   (x86_64-pc-windows-gnu) and for a 32-bit target without files
  #   (wasm32-unknown-unknown).
  # - `lint-cross`: pdf-lint built for Windows and for wasm32-wasip1, whose
  #   reads of standard input for `--password-file -` are code of their own.
  # - `tokenizer-no-std` and `tokenizer-core-only`: pdf-tokenizer built for
  #   thumbv6m-none-eabi on stable, and against core alone (-Z build-std=core)
  #   on nightly.
  targets:
    name: Cross targets, no_std, and release archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Install nightly first so stable installed second remains the default
      # toolchain, while `cargo +nightly` reaches nightly's rust-src.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-unknown-linux-musl, x86_64-pc-windows-gnu, wasm32-unknown-unknown, wasm32-wasip1, thumbv6m-none-eabi
      - uses: extractions/setup-just@v4
      - name: Build and check the release archive
        run: just dist
      - name: Lint pdf-structure for Windows and wasm32-unknown-unknown
        run: just structure-cross
      - name: Build pdf-lint for Windows and wasm32-wasip1
        run: just lint-cross
      - name: Build pdf-tokenizer without std
        run: just tokenizer-no-std
      - name: Build pdf-tokenizer on core alone
        run: just tokenizer-core-only

  # pdf-structure's tests run on Windows, where a file is read by position
  # and its identity held by code of its own (same-file's), which no other
  # job runs. Its one step is cargo's, not a recipe's: `just ci` runs where
  # this platform isn't.
  structure-windows:
    name: pdf-structure's tests on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.152
      - name: Test
        run: |
          cargo nextest run --locked -p pdf-structure
          cargo test --locked -p pdf-structure --doc

  # Every crate tested on its oldest supported Rust (`rust-version` in its
  # Cargo.toml), sharing one target directory so common dependencies build
  # once. Each `*-msrv` recipe invokes `cargo +<msrv>` directly, and the setup
  # step installs every unique `rust-version` declared across `crates/*`.
  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.92
      - name: Ensure all crate rust-version toolchains are installed
        run: |
          for tc in $(sed -n 's/^rust-version = "\(.*\)"$/\1/p' crates/*/Cargo.toml | sort -u); do
            rustup toolchain install "$tc" --profile minimal --no-self-update
          done
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.152
      - uses: extractions/setup-just@v4
      - name: pdf-tokenizer
        run: just tokenizer-msrv
      - name: pdf-filters
        run: just filters-msrv
      - name: pdf-crypt
        run: just crypt-msrv
      - name: pdf-objects
        run: just objects-msrv
      - name: pdf-structure
        run: just structure-msrv
      - name: pdf-content-streams
        run: just content-msrv
      - name: pdf-semantics
        run: just semantics-msrv
      - name: pdf-color
        run: just color-msrv
      - name: pdf-images
        run: just images-msrv
      - name: pdf-fonts
        run: just fonts-msrv fonts-cmaps-msrv
      - name: pdf-gfx
        run: just gfx-msrv gfx-cmaps-msrv
      - name: pdf-annots
        run: just annots-msrv annots-cmaps-msrv
      - name: pdf-forms
        run: just forms-msrv forms-cmaps-msrv
      - name: pdf-raster
        run: just raster-msrv raster-cmaps-msrv
      - name: pdf-linearize
        run: just linearize-msrv
      - name: pdfs
        run: just pdfs-msrv
      - name: pdf-arlington
        run: just arlington-msrv
      - name: pdf-lint
        run: just lint-msrv

  # Every published crate packaged as a publish would, each in an isolated
  # target directory and CARGO_HOME (`justfile`'s `_package`), checking that
  # the package builds against crates.io (and any unpublished alpha crates of
  # the family beside it) and holds only its allowed files and no benchmarks.
  package:
    name: Published packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: extractions/setup-just@v4
      - name: pdf-tokenizer
        run: just tokenizer-package
      - name: pdf-objects
        run: just objects-package
      - name: pdf-filters
        run: just filters-package
      - name: pdf-crypt
        run: just crypt-package
      - name: pdf-color
        run: just color-package
      - name: pdf-images
        run: just images-package
      - name: pdf-structure
        run: just structure-package
      - name: pdf-content-streams
        run: just content-streams-package
      - name: pdf-semantics
        run: just semantics-package
      - name: pdf-fonts
        run: just fonts-package
      - name: pdf-gfx
        run: just gfx-package
      - name: pdf-annots
        run: just annots-package
      - name: pdf-forms
        run: just forms-package
      - name: pdf-raster
        run: just raster-package
      - name: pdf-linearize
        run: just linearize-package
      - name: pdfs
        run: just pdfs-package
      - name: pdf-arlington
        run: just arlington-package
      - name: pdf-lint
        run: just lint-package

  # Each published crate's public API checked against its version on crates.io.
  # cargo-semver-checks comes as a prebuilt binary at a pinned version beside
  # the Rust toolchain whose rustdoc JSON format it reads. Release-line crates
  # (`pdf-tokenizer`, `pdf-lint`) are held to semver; alpha crates are held by
  # `justfile`'s `_semver` so a published alpha version may not move its API,
  # while an unpublished next alpha passes.
  semver:
    name: Published API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@0.51.0
      - uses: extractions/setup-just@v4
      - name: pdf-tokenizer
        run: just tokenizer-semver
      - name: pdf-objects
        run: just objects-semver
      - name: pdf-filters
        run: just filters-semver
      - name: pdf-crypt
        run: just crypt-semver
      - name: pdf-color
        run: just color-semver
      - name: pdf-lint
        run: just lint-semver

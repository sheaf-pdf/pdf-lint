# The fuzz targets, in cargo-fuzz's layout, outside the workspace: they
# build on nightly with libFuzzer. Locally, `just fuzz tokenize`,
# `just fuzz filters`, `just fuzz crypt`, `just fuzz objects`,
# `just fuzz structure` or `just fuzz check`, or:
#
#   cargo +nightly fuzz run tokenize -- -dict=fuzz/pdf.dict
#
# `tokenize` calls `pdf_tokenizer::fuzz::tokenize`, which a stable unit test
# (`random_inputs_keep_every_promise`) runs too; `filters` calls
# `pdf_filters::fuzz::filters` on each backend, which two stable unit tests
# run on random and damaged inputs, and `pdf_filters::fuzz::encoders`, which
# a third runs; `crypt` calls
# `pdf_crypt::fuzz::handler` and `pdf_crypt::fuzz::password`, which a stable
# unit test each runs; `objects`
# calls `pdf_objects::fuzz::parse`, the parser, the walk of what it read's
# references and the writer on what it read, which a stable unit test
# (`random_fragments_keep_every_promise`) runs; `structure` calls
# `pdf_structure::fuzz::read_file`, the reader and the document it reads,
# which a stable unit test
# (`mutated_files_read_within_their_bytes_the_same_twice`) runs on mutated
# files; `check` calls
# `pdf_lint::fuzz::check_file`, the reader and the checker, which a stable
# unit test (`mutated_files_check_within_their_bytes_the_same_twice`) runs
# on mutated seeds.
[package]
name = "pdf-tokenizer-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
pdf-crypt = { path = "../crates/pdf-crypt", features = ["writer"] }
# Both Flate backends, so that the filters' target runs on each.
pdf-filters = { path = "../crates/pdf-filters", features = ["zlib-rs"] }
# The library alone, without the command line's crates.
pdf-lint = { path = "../crates/pdf-lint", default-features = false }
pdf-objects = { path = "../crates/pdf-objects" }
pdf-structure = { path = "../crates/pdf-structure", features = ["fixtures"] }
pdf-tokenizer = { path = "../crates/pdf-tokenizer" }

[[bin]]
name = "tokenize"
path = "fuzz_targets/tokenize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "filters"
path = "fuzz_targets/filters.rs"
test = false
doc = false
bench = false

[[bin]]
name = "crypt"
path = "fuzz_targets/crypt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "objects"
path = "fuzz_targets/objects.rs"
test = false
doc = false
bench = false

[[bin]]
name = "structure"
path = "fuzz_targets/structure.rs"
test = false
doc = false
bench = false

[[bin]]
name = "check"
path = "fuzz_targets/check.rs"
test = false
doc = false
bench = false

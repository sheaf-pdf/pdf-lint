# The fuzz targets, in cargo-fuzz's layout, outside the workspace: they
# build on nightly with libFuzzer. Locally, `just fuzz tokenize`,
# `just fuzz filters`, `just fuzz objects` or `just fuzz check`, or:
#
#   cargo +nightly fuzz run tokenize -- -dict=fuzz/pdf.dict
#
# `tokenize` calls `pdf_tokenizer::fuzz::tokenize`, which a stable unit test
# (`random_inputs_keep_every_promise`) runs too; `filters` calls
# `pdf_filters::fuzz::filters`, which two stable unit tests run on random
# and damaged inputs; `crypt` calls
# `pdf_crypt::fuzz::handler`, which a stable unit test runs; `objects`
# calls `pdf_objects::fuzz::parse`, the parser, and the writer on what it
# read, which a stable unit test (`random_fragments_keep_every_promise`)
# runs; `check` calls
# `pdf_lint::fuzz::check_file`, the reader and the checker, which a stable
# unit test (`mutated_files_check_within_their_bytes_the_same_twice`) runs
# on mutated seeds.
[package]
name = "pdf-tokenizer-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
pdf-crypt = { path = "../crates/pdf-crypt", features = ["writer"] }
pdf-filters = { path = "../crates/pdf-filters" }
pdf-lint = { path = "../crates/pdf-lint" }
pdf-objects = { path = "../crates/pdf-objects" }
pdf-tokenizer = { path = "../crates/pdf-tokenizer" }

[[bin]]
name = "tokenize"
path = "fuzz_targets/tokenize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "filters"
path = "fuzz_targets/filters.rs"
test = false
doc = false
bench = false

[[bin]]
name = "crypt"
path = "fuzz_targets/crypt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "objects"
path = "fuzz_targets/objects.rs"
test = false
doc = false
bench = false

[[bin]]
name = "check"
path = "fuzz_targets/check.rs"
test = false
doc = false
bench = false

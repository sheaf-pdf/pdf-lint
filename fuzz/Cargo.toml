# The fuzz targets, in cargo-fuzz's layout, outside the workspace: they
# build on nightly with libFuzzer. Locally, `just fuzz tokenize`,
# `just fuzz filters`, `just fuzz crypt`, `just fuzz objects`,
# `just fuzz structure`, `just fuzz write`, `just fuzz content`,
# `just fuzz semantics`, `just fuzz color`, `just fuzz fonts`,
# `just fuzz linearize`, `just fuzz pdfs` or `just fuzz check`, or:
#
#   cargo +nightly fuzz run tokenize -- -dict=fuzz/pdf.dict
#
# With `simd` (`just fuzz content 300 simd`, or `cargo +nightly fuzz run
# --features simd content`), pdf-content-streams' dependencies pick the
# CPU's SIMD as they run, as its `simd` feature has them do, so `content`
# reaches the `unsafe` code that takes it. With `predefined-cmaps` (`just
# fuzz fonts 300 predefined-cmaps`), pdf-fonts reads a predefined CMap from
# its bundle, as its feature of that name has it, so `fonts` reaches what
# a name that's one reads; without it, as pdf-lint's binary is built, a
# name that's one reads as one the build hasn't, as it does in `check`.
#
# `tokenize` calls `pdf_tokenizer::fuzz::tokenize`, the tokenizer and its
# decoders under ISO 32000-2's rules and PDFium's and the two side by side,
# and its skims, passes and searches against plain walks, which two stable
# unit tests (`random_inputs_keep_every_promise` and
# `random_inputs_keep_every_promise_where_the_rules_part`) run too;
# `filters` calls `pdf_filters::fuzz::filters` on each backend, the
# filters and the first of them on data that may run on (what it read
# held to the input), each under qpdf's reading and PDFium's (PDFium's
# held to qpdf's where neither of its own faults is said), which two
# stable unit tests run on random and damaged inputs, and
# `pdf_filters::fuzz::encoders`, which a third runs; `crypt` calls
# `pdf_crypt::fuzz::handler`, on any dictionary and on new files'
# dictionaries, and `pdf_crypt::fuzz::password`, which three stable unit
# tests run, one on new files'; `objects` calls `pdf_objects::fuzz::parse`,
# the parser by ISO 32000-2's rules and PDFium's and the two side by side,
# the walk of what it read's references and the writer on what it read,
# and `pdf_objects::fuzz::texts`, text strings decoded by each rules and
# encoded and read back, which three stable unit tests
# (`random_fragments_keep_every_promise`,
# `random_fragments_keep_every_promise_where_the_rules_part` and
# `random_text_strings_keep_every_promise`) run;
# `structure` calls `pdf_structure::fuzz::read_file`, the reader and the
# document it reads, which a stable unit test
# (`mutated_files_read_within_their_bytes_the_same_twice`) runs on mutated
# files; `write` calls `pdf_structure::fuzz::write_file`, the writer, a
# file read written whole with copies, under a renumbering the input
# picks, its document as the input picks read whole and taken by the
# reading, then an update of its objects or a whole write after a byte is
# flipped, refused as changed or read back alike, which a stable unit test
# (`mutated_files_write_and_read_back_alike`) runs on mutated files, from
# seeds with the third byte its input has;
# `content` calls `pdf_content_streams::fuzz::content`, a page's content
# read whole and as two streams, its tokens tiling it, each operand read,
# its number as PDFium reads it and as an object, and its operations its
# tokens grouped, and again under small caps, what finding inline images'
# ends may cost among them, its faults the same through any sink, where an
# object ends an inline image's dictionary and each lone `BI` told, and
# each 0x80 and 0xFF read as white-space between tokens told, a space in
# its place reading the same, each operation typed and stepped through the
# states, its balance, marked content and names its steppers', its
# searches for an inline image's end and its walks past one to `EI`,
# remembered or not, and its skims of
# arrays and dictionaries the same as plain ones', its DCT and CCITTFax
# data decoded, with the `image-ends` feature, and read by the stand-in
# too, its operations written again reading as they did, and the writer's
# calls its bytes choose read back as written, their resources named and
# bumped in the same places, and its marked ranges at the top taken out,
# alone, together and by splice_each, and their lists written again
# without a tool's keys, alone and with what's taken out, what's kept
# reading as it did, and an array in it counted alike as an inline image's
# color space and as one the resources name, under any caps on either;
# marked content's cap and an inline color space's held at their edges,
# and `splice_each`'s reads at its cap and a byte under; content that holds
# an image a cap sized refused by every edit; and pairs of objects its
# bytes choose the same as resources exactly where their digests' bytes
# are, `Res::of` refusing exactly what holds data not in memory; and its
# bytes as a page's `/Contents` and the objects it names, joined as a plain
# reading of PDFium's joins them; which four stable unit tests
# (`mutated_seeds_keep_every_promise`, `random_fragments_keep_every_promise`,
# `resources_chosen_are_both_the_same_and_apart` and
# `contents_chosen_come_to_each_answer`) run on mutated seeds, random
# content, random pairs and random files;
# `semantics` calls `pdf_semantics::fuzz::walks`, its name and number trees,
# each walked the same whatever hears its faults, what a plain walk gives,
# its nodes with neither `/Kids` nor entries, or both, said as it finds them,
# and written, read back, and its page tree by both rules, and a page tree
# written, balanced, and read back by both, or refused before an id is
# asked for but one refused, `pdf_semantics::fuzz::dates`, a date read,
# written and read back,
# `pdf_semantics::fuzz::xmp`, a packet read the same whatever hears its
# faults, under smaller caps and with its empty elements open and closed, as
# a claim's text beside an element, never taken, and through a file's
# streams' data, the same, and past a cap nothing read, and its claims, and
# claims made of its text, written and read back, or refused, and
# `pdf_semantics::fuzz::over`, a file's trees,
# pages, metadata stream and `/Info`, read typed by both rules, through a
# reading and the document it makes, which
# three stable unit tests (`mutated_seeds_keep_every_promise`,
# `random_bytes_keep_every_promise`,
# `files_read_alike_through_a_reading_and_its_document`) run, the last as a
# file, as the target does but under the default options;
# `color` calls `pdf_color::fuzz::counts`, each of its first objects counted, the
# count within what it could be, within every cap, the same under larger and
# smaller caps where none was met and a failing resolver's reason kept, read as
# a typed space, the same whatever the sink, a failing read included, counting as
# it was counted where no fault was told and no cap met, and read as resources,
# the same by name as in order, its names counted as they're given as each is
# counted alone, and `pdf_color::fuzz::over`, what a file's objects
# count, say as typed spaces and name through a reading and the document it makes,
# which three stable unit tests (`mutated_seeds_keep_every_promise`,
# `random_bytes_keep_every_promise`,
# `files_read_alike_through_a_reading_and_its_document`) run, the last as a file,
# as the target does but under the default options;
# `fonts` calls `pdf_fonts::fuzz::type1`, any bytes scanned as a Type 1 program,
# holding no more than it was given, and under other caps the same or refused;
# `pdf_fonts::fuzz::names`, an input's words read as glyphs' and fonts' names,
# and its bytes as codes in each encoding; `written`, its bytes as text in each
# standard 14 font, its codes read back as it; `fonts`, its parts read as a font, a
# program among them; `shown`, the input as a page's content, the strings it shows
# in those fonts and in forms, the same over fonts kept and less under smaller caps
# and a smaller budget; and `over`, as a file, each font in it the same; which five
# stable unit tests (`mutated_seeds_keep_every_promise`,
# `random_bytes_keep_every_promise`, `the_fonts_among_the_seeds_read`,
# `the_contents_among_the_seeds_show_strings`,
# `files_read_alike_through_a_reading_and_a_map`) run;
# `linearize` calls `pdf_linearize::fuzz::graphs`, any bytes as a graph, refused
# for what it has or planned, every promise of the plan held against plain walks
# of it, and `tables`, the same bytes as a hint stream, which a stable unit test
# (`fuzz_bodies_run`) runs; `facts`, the same bytes as a file's facts, judged the
# same whatever the sink, nothing judged that depends on what they say wasn't
# read, which another (`any_facts_are_judged_alike_whatever_the_sink`) runs; and
# `pdf_linearize::fuzz::over`, the same bytes as a file, laid out in the clear,
# under its own encryption as it is and told to reuse RC4's keystreams, and
# under a new one, and read back, what's listed as written at a keystream used
# held to what it wrote, and under caps on its trees, refused where its page
# tree is past them and its check telling it as not judged, which a third
# (`what_is_written_reads_back_the_same`)
# runs on mutated files, its new encryption drawn from the input and every IV
# derived, so that an input writes the same bytes each run, which a fourth
# (`what_is_written_of_an_input_is_the_same_bytes_each_time`) holds.
# `pdfs` calls `pdfs::fuzz::read`, a file read through the facade under its
# defaults, with faults kept, the same, and under small caps: its version,
# catalog, `/Info`, claims, pages, each page's content joined within its cap
# and its operations walked, its fonts and its text, which fails only as its
# content does, and its linearization's verdict, holding only
# where it's linearized; and its document written in the clear and under a
# new encryption, its key drawn from the input, read locked, each page's
# content refused as locked, and unlocked by its password, read as in the
# clear; and `pdfs::fuzz::write`, a new document of its first pages, their
# content written again, saved whole, with a table, linearized and under a new
# encryption, each read back as written; which four stable unit tests
# (`the_seeds_keep_every_promise_and_reach_each`,
# `the_seeds_write_documents_read_back_as_written`,
# `mutated_seeds_keep_every_promise` and `random_bytes_keep_every_promise`)
# run on its seeds, mutated seeds and random bytes.
# The lopdf adapter's body, in its crate (pdf-linearize-lopdf), which is never
# published, isn't here: a stable test of that crate
# (`what_lopdf_s_adapter_writes_of_any_document_holds`) runs it;
# `check` calls
# `pdf_lint::fuzz::check_file`, the reader and the checker, what only the
# reading gives (content, fonts' streams, earlier revisions' objects and the
# linearization) read beside the document and moving nothing else a check of
# the document alone finds, which a stable unit test
# (`mutated_files_check_within_their_bytes_the_same_twice`) runs on mutated
# seeds.
[package]
name = "pdf-tokenizer-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# With `image-ends`, so the content target can read with DCT and CCITTFax
# data decoded to find where an inline image's ends, as it asks to.
pdf-content-streams = { path = "../crates/pdf-content-streams", features = ["image-ends"] }
pdf-color = { path = "../crates/pdf-color" }
# With the test writer, so the crypt target makes new files from the input's
# draws, and the write target new encryptions.
pdf-crypt = { path = "../crates/pdf-crypt", features = ["insecure-test-writer"] }
# Both Flate backends, so that the filters' target runs on each.
pdf-filters = { path = "../crates/pdf-filters", features = ["zlib-rs"] }
# With its defaults, `programs` among them, so `fonts` reads programs. Without
# `predefined-cmaps`, as pdf-lint's binary is built, so `check` reads a font
# as the binary does: pdf-lint reads fonts for text, which reads no program
# whatever the features. The feature of that name below turns it on.
pdf-fonts = { path = "../crates/pdf-fonts" }
# With the test writer, so the linearize target's new encryptions are drawn
# from the input and every write's IVs derived: an input writes the same
# bytes each run, and a saved one reruns as it ran. `check` reads as the
# binary does: the feature moves nothing it reads.
pdf-linearize = { path = "../crates/pdf-linearize", features = ["insecure-test-writer"] }
# The library alone, without the command line's crates.
pdf-lint = { path = "../crates/pdf-lint", default-features = false }
# With its defaults, as a user builds it, and its test writer, so the pdfs
# target's new encryption is drawn from the input and every IV derived: an
# input writes the same bytes each run, and a saved one reruns as it ran.
pdfs = { path = "../crates/pdfs", features = ["insecure-test-writer"] }
pdf-objects = { path = "../crates/pdf-objects" }
# With its default features, so the semantics target fuzzes the clock's
# reading of a count of seconds too.
pdf-semantics = { path = "../crates/pdf-semantics" }
pdf-structure = { path = "../crates/pdf-structure", features = ["insecure-test-writer"] }
pdf-tokenizer = { path = "../crates/pdf-tokenizer" }

[features]
# pdf-content-streams' dependencies on the CPU's SIMD, found as they run.
simd = ["pdf-content-streams/simd"]
# Adobe's predefined CMaps, from pdf-fonts' bundle, so a name that's one
# reaches it.
predefined-cmaps = ["pdf-fonts/predefined-cmaps"]

[[bin]]
name = "tokenize"
path = "fuzz_targets/tokenize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "filters"
path = "fuzz_targets/filters.rs"
test = false
doc = false
bench = false

[[bin]]
name = "crypt"
path = "fuzz_targets/crypt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "objects"
path = "fuzz_targets/objects.rs"
test = false
doc = false
bench = false

[[bin]]
name = "structure"
path = "fuzz_targets/structure.rs"
test = false
doc = false
bench = false

[[bin]]
name = "write"
path = "fuzz_targets/write.rs"
test = false
doc = false
bench = false

[[bin]]
name = "content"
path = "fuzz_targets/content.rs"
test = false
doc = false
bench = false

[[bin]]
name = "semantics"
path = "fuzz_targets/semantics.rs"
test = false
doc = false
bench = false

[[bin]]
name = "color"
path = "fuzz_targets/color.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fonts"
path = "fuzz_targets/fonts.rs"
test = false
doc = false
bench = false

[[bin]]
name = "linearize"
path = "fuzz_targets/linearize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pdfs"
path = "fuzz_targets/pdfs.rs"
test = false
